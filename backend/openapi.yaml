components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        legacy_id:
          type: string
          readOnly: true
          nullable: true
        client:
          type: string
          format: uuid
        client_name:
          type: string
          readOnly: true
        full_text:
          type: string
          maxLength: 320
        reference:
          type: string
          maxLength: 240
        legacy_locked:
          type: boolean
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - client
      - client_name
      - created_at
      - full_text
      - id
      - legacy_id
      - legacy_locked
      - updated_at
    ApplicationSettings:
      type: object
      properties:
        base_message:
          type: string
          maxLength: 500
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - updated_at
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        legacy_id:
          type: string
          readOnly: true
          nullable: true
        name:
          type: string
          maxLength: 180
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
        dni:
          type: string
          maxLength: 32
        is_delinquent:
          type: boolean
        condition:
          type: string
          maxLength: 200
        legacy_duplicate_allowed:
          type: boolean
          readOnly: true
        legacy_locked:
          type: boolean
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        addresses_count:
          type: integer
          readOnly: true
        services_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - addresses_count
      - archived_at
      - created_at
      - id
      - legacy_duplicate_allowed
      - legacy_id
      - legacy_locked
      - name
      - phone
      - services_count
      - updated_at
    CompleteService:
      type: object
      properties:
        notes:
          type: string
        amount_due:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        collected_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
      required:
      - notes
    Csrf:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    DailyCash:
      type: object
      properties:
        date:
          type: string
          format: date
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        voided_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        by_method:
          type: array
          items:
            type: object
            additionalProperties: {}
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
      required:
      - by_method
      - date
      - payments
      - total
      - voided_total
    Dashboard:
      type: object
      properties:
        date:
          type: string
          format: date
        range:
          type: object
          additionalProperties: {}
        counts:
          type: object
          additionalProperties:
            type: integer
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceList'
        overview:
          type: object
          additionalProperties: {}
        finance:
          type: object
          additionalProperties: {}
          nullable: true
        service_trend:
          type: array
          items:
            type: object
            additionalProperties: {}
        revenue_trend:
          type: array
          items:
            type: object
            additionalProperties: {}
        status_breakdown:
          type: array
          items:
            type: object
            additionalProperties: {}
        technician_workload:
          type: array
          items:
            type: object
            additionalProperties: {}
        payment_methods:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - counts
      - date
      - finance
      - overview
      - payment_methods
      - range
      - revenue_trend
      - service_trend
      - services
      - status_breakdown
      - technician_workload
    DataIssue:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        source:
          type: string
          readOnly: true
        row_reference:
          type: string
          readOnly: true
        issue_type:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        payload:
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - issue_type
      - payload
      - resolved_at
      - resolved_by
      - row_reference
      - source
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    KindEnum:
      enum:
      - CREATED
      - ASSIGNED
      - REASSIGNED
      - RESCHEDULED
      - ARRIVED
      - NOTE_ADDED
      - COMPLETED
      - CANCELLED
      - REOPENED
      - ARCHIVED
      - RESTORED
      - CONFLICT
      type: string
      description: |-
        * `CREATED` - Creado
        * `ASSIGNED` - Asignado
        * `REASSIGNED` - Reasignado
        * `RESCHEDULED` - Reprogramado
        * `ARRIVED` - Llegada
        * `NOTE_ADDED` - Observación
        * `COMPLETED` - Finalizado
        * `CANCELLED` - Cancelado
        * `REOPENED` - Reabierto
        * `ARCHIVED` - Archivado
        * `RESTORED` - Restaurado
        * `CONFLICT` - Conflicto
